apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:

  name: ai-agent-ingress

  namespace: ai-agent

  annotations:

    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

spec:

  ingressClassName: nginx

  rules:

    - http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: ai-agent-frontend

                port:

                  number: 80
