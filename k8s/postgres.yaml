apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ai-agent
type: Opaque
stringData:

  POSTGRES_DB: ai_agent

  POSTGRES_USER: postgres

  POSTGRES_PASSWORD: postgres


---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-agent

spec:

  clusterIP: None

  selector:
    app: postgres

  ports:

    - port: 5432
      targetPort: 5432


---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-agent

spec:

  serviceName: postgres

  replicas: 1

  selector:

    matchLabels:
      app: postgres


  template:

    metadata:

      labels:
        app: postgres


    spec:

      tolerations:

        - key: "devops"

          operator: "Equal"

          value: "true"

          effect: "NoSchedule"


      containers:

        - name: postgres

          image: postgres:16-alpine

          ports:

            - containerPort: 5432


          env:

            - name: POSTGRES_DB

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_DB


            - name: POSTGRES_USER

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_USER


            - name: POSTGRES_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: postgres-secret

                  key: POSTGRES_PASSWORD


          volumeMounts:

            - name: postgres-data

              mountPath: /var/lib/postgresql/data


          readinessProbe:

            exec:

              command:

                - sh
                - -c
                - pg_isready -U postgres -d ai_agent

            initialDelaySeconds: 10

            periodSeconds: 5

            timeoutSeconds: 3

            failureThreshold: 6


          livenessProbe:

            exec:

              command:

                - sh
                - -c
                - pg_isready -U postgres -d ai_agent

            initialDelaySeconds: 30

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 5


  volumeClaimTemplates:

    - metadata:

        name: postgres-data

      spec:

        accessModes:

          - ReadWriteOnce

        resources:

          requests:

            storage: 5Gi
