apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-frontend
  namespace: ai-agent

spec:

  replicas: 2

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 0

      maxSurge: 1


  selector:

    matchLabels:

      app: ai-agent-frontend


  template:

    metadata:

      labels:

        app: ai-agent-frontend


    spec:

      tolerations:

        - key: "devops"

          operator: "Equal"

          value: "true"

          effect: "NoSchedule"


      containers:

        - name: frontend

          image: srushti22/ai-agent-frontend:1.0

          imagePullPolicy: Always

          ports:

            - containerPort: 80


          readinessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 5

            periodSeconds: 5

            timeoutSeconds: 3

            failureThreshold: 6


          livenessProbe:

            httpGet:

              path: /

              port: 80

            initialDelaySeconds: 20

            periodSeconds: 10

            timeoutSeconds: 3

            failureThreshold: 5


          resources:

            requests:

              cpu: 50m

              memory: 64Mi

            limits:

              cpu: 300m

              memory: 256Mi


---

apiVersion: v1
kind: Service

metadata:

  name: ai-agent-frontend

  namespace: ai-agent


spec:

  type: ClusterIP

  selector:

    app: ai-agent-frontend

  ports:

    - port: 80

      targetPort: 80
